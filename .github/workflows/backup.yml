name: Backup harian

# Memanggil artisan backup:jalankan di server lewat SSH, sejalur dengan
# deploy.yml dan debug-log.yml.
#
# ⚠️ Jadwal GitHub Actions tidak dijamin tepat waktu — bisa telat puluhan menit
# saat antrean padat — dan DINONAKTIFKAN OTOMATIS setelah 60 hari repositori
# tidak ada aktivitas. Ketelatan tidak masalah untuk backup harian;
# penonaktifan masalah, dan yang memberi tahu adalah kartu umur backup di
# halaman Backup Sistem, bukan orang yang kebetulan curiga.
on:
  schedule:
    - cron: '0 16 * * *'   # 16:00 UTC = 23:00 WIB, sesudah shift 2 selesai
  workflow_dispatch:

# Grup sama dengan deploy.yml supaya keduanya SERIAL — kalau tidak, backup
# bisa mendarat sementara rsync/composer install sedang menulis ulang berkas
# server. cancel-in-progress SENGAJA false: backup yang dimatikan di tengah
# jalan meninggalkan arsip zip setengah jadi, beda dari deploy yang aman
# diulang dari awal.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REMOTE_PATH: /home/u518638233/domains/optima.kencomanufactur.co.id/public_html
  REMOTE_PHP: /opt/alt/php84/usr/bin/php

jobs:
  backup:
    runs-on: ubuntu-latest
    # Job ini masuk grup concurrency yang sama dengan deploy.yml (lihat di
    # bawah) — sesi SSH yang menggantung tanpa batas waktu bisa menahan grup
    # itu sampai 360 menit (default GitHub) dan memblokir SETIAP merge ke main
    # selama itu. timeout-minutes di sini jadi jaring pengaman terpisah dari
    # timeout Process 600s di sisi mysqldump — yang itu cuma membatasi
    # mysqldump-nya, bukan transport SSH yang macet.
    timeout-minutes: 20
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan kadang gagal sesaat (network runner→host). Coba beberapa kali,
          # JANGAN gagalkan job kalau tetap gagal — ssh pakai accept-new (di bawah)
          # sebagai jaring pengaman verifikasi host. Sama seperti deploy.yml.
          for i in 1 2 3; do
            ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          true

      # Step ini MERAH kalau backup gagal karena `ssh` meneruskan kode keluar
      # perintah remote sebagai kode keluarnya sendiri, dan shell `run:` di
      # GitHub Actions sudah jalan dengan `-e` secara default (exit begitu ada
      # perintah yang gagal). `set -e` di bawah cuma menegaskan itu, bukan
      # syarat supaya step ini merah.
      #
      # ConnectTimeout/ServerAlive* membatasi transport SSH itu sendiri —
      # tanpa ini sesi yang macet (bukan gagal) bisa menggantung sampai
      # timeout-minutes job di atas, menahan grup concurrency deploy-production
      # selama itu.
      - name: Jalankan backup
        run: |
          set -e
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan backup:jalankan"
