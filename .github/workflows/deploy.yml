name: Deploy to Hostinger (SSH)

# Deploy via SSH, bukan FTP. Alasan: vendor/ Laravel + phpspreadsheet
# ~14.000 file — FTP (1 file = 1 round-trip) butuh berjam-jam, nembus
# limit sesi FTP Hostinger (3600s). Solusi: kirim source code via
# rsync-over-SSH (~370 file, detik-an), lalu `composer install` JALAN
# DI SERVER — vendor/ tidak pernah ditransfer lewat jaringan sama sekali.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REMOTE_PATH: /home/u518638233/domains/optima.kencomanufactur.co.id/public_html
  REMOTE_PHP: /opt/alt/php84/usr/bin/php   # default `php` server = 8.1, project butuh ^8.3

jobs:
  # Gerbang mutu, job terpisah dari deploy. `php -l` cuma melihat syntax, sementara tiap
  # bug yang pernah ketemu di project ini justru TIDAK melempar error — route register
  # terbuka, tahun 0026 lolos validasi, SPH keinjek 0. Semua "sehat" menurut lint, tapi
  # datanya diam-diam berhenti terhitung. Cuma test suite yang menangkap kelas bug itu.
  #
  # Dipisah (bukan step di dalam deploy) supaya workspace deploy tetap bersih: `composer
  # install` menghasilkan bootstrap/cache/packages.php, dan folder itu tidak ada di daftar
  # exclude rsync — kalau digabung, artefak runner ikut terkirim ke server.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'   # samakan dengan server (REMOTE_PHP = php84)
          # pdo_sqlite: test pakai SQLite in-memory (phpunit.xml).
          # zip/gd/mbstring: dibutuhkan phpspreadsheet lewat maatwebsite/excel.
          extensions: mbstring, pdo_sqlite, sqlite3, zip, gd, bcmath
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Test suite
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    needs: test          # test merah = deploy tidak pernah jalan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v5

      - name: Setup PHP (buat lint gate)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Gerbang mutu — kalau ada file rusak, deploy dibatalkan.
      - name: Lint PHP (syntax gate)
        run: |
          err=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" >/dev/null 2>&1; then
              echo "::error file=$f::PHP parse error"
              php -l "$f" || true
              err=1
            fi
          done < <(find app bootstrap config database routes -name '*.php' -print0)
          exit $err

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan kadang gagal sesaat (network runner→host). Coba beberapa kali,
          # JANGAN gagalkan deploy kalau tetap gagal — ssh pakai accept-new (di bawah)
          # sebagai jaring pengaman verifikasi host.
          for i in 1 2 3; do
            ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          true

      # Sync source code saja (vendor/storage/.env dikecualikan — vendor
      # dibangun di server, storage & .env persisten & tidak boleh ketimpa).
      - name: Rsync source code ke server
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude='.git/' \
            --exclude='.git*' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='.github/' \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.claude/' \
            --exclude='.superpowers/' \
            --exclude='memory/' \
            --exclude='.phpunit.result.cache' \
            --exclude='auth.json' \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_PATH }}/"

      # vendor/ dibangun LANGSUNG di server (14rb file tak pernah lewat jaringan).
      - name: Composer install di server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction"

      # CATATAN: DB prod dikelola manual (schema drift) — `migrate` blanket meledak
      # di migration lama yang perubahannya sudah diterapkan manual. Jadi jalankan
      # HANYA migration yang memang perlu diterapkan, per --path. Tambah baris baru
      # di sini tiap ada migration yang harus jalan di prod.
      #
      # ⚠️ LUPA menambah baris di sini GAGALNYA SENYAP: step ini tetap hijau dan
      # mencetak "Nothing to migrate", padahal kodenya sudah live di prod tanpa
      # kolom/enum yang dibutuhkan. Itu persis yang terjadi pada migration enum
      # role 'guest' (PR #37) — fitur terpasang tapi DB prod menolak nilai barunya.
      # Setiap menambah migration, tambahkan --path-nya DI SINI dalam PR yang sama.
      - name: Migrate (targeted) di server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan migrate --force \
              --path=database/migrations/2026_07_12_000001_change_tipe_mesin_to_string_on_master_mesin.php \
              --path=database/migrations/2026_07_15_000001_create_dies_preventive_log_table.php \
              --path=database/migrations/2026_07_15_000002_add_staff_maintenance_to_users_role_enum.php \
              --path=database/migrations/2026_07_15_000003_create_mesin_preventive_log_table.php \
              --path=database/migrations/2026_07_17_014834_add_durasi_menit_to_transaksi_produksi.php \
              --path=database/migrations/2026_07_23_000001_add_checksheet_path_to_dies_preventive_log_table.php \
              --path=database/migrations/2026_07_27_000001_add_guest_to_users_role_enum.php \
              --path=database/migrations/2026_07_28_000001_add_kategori_to_master_jenis_ng.php \
              --path=database/migrations/2026_07_28_000002_create_transaksi_produksi_ng_table.php \
              --path=database/migrations/2026_07_28_000003_create_transaksi_qc_ng_table.php \
              --path=database/migrations/2026_07_28_000004_migrate_existing_ng_to_detail_tables.php \
              --path=database/migrations/2026_08_04_000001_add_dihitung_availability_to_master_shift.php \
              --path=database/migrations/2026_08_21_000001_add_tanggal_nonaktif_to_master_karyawan.php \
              --path=database/migrations/2026_08_21_000002_backfill_tanggal_nonaktif_karyawan.php \
              --path=database/migrations/2026_08_29_021921_add_is_aktif_to_users_table.php \
              --path=database/migrations/2026_08_29_032922_convert_users_role_to_roles_array.php \
              --path=database/migrations/2026_08_29_165626_add_two_factor_columns_to_users_table.php \
              --path=database/migrations/2026_08_29_181501_add_created_at_index_to_activity_log_table.php"

      # Inject secret runtime (mis. CEREBRAS_API_KEY) ke .env server dari GitHub
      # Secrets — .env tidak pernah di-commit. No-op kalau secret belum diisi.
      - name: Sync runtime secrets ke .env server
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          upsert() {
            # upsert KEY VALUE ke .env server (hapus baris lama, tambah baru).
            ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USERNAME@$SSH_HOST" \
              "cd '${{ env.REMOTE_PATH }}' && grep -v '^$1=' .env > .env.new 2>/dev/null; mv .env.new .env; printf '%s=%s\n' '$1' '$2' >> .env"
            echo "$1 di-set di server."
          }
          if [ -n "$CEREBRAS_API_KEY" ]; then upsert CEREBRAS_API_KEY "$CEREBRAS_API_KEY"; fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then upsert DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"; fi

      # Cache config/route/view supaya tiap request tidak parse ulang config,
      # register ulang 193 route, dan cek-kompilasi ulang tiap Blade view.
      # WAJIB config:clear dulu — cache lama (kalau ada) harus dibuang sebelum
      # di-generate ulang dari .env yang baru saja disentuh step di atas,
      # kalau tidak config:cache membaca cache basi bukan .env terbaru.
      - name: Cache config/route/view di server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan config:clear && ${{ env.REMOTE_PHP }} artisan route:clear && ${{ env.REMOTE_PHP }} artisan view:clear && ${{ env.REMOTE_PHP }} artisan config:cache && ${{ env.REMOTE_PHP }} artisan route:cache && ${{ env.REMOTE_PHP }} artisan view:cache"
