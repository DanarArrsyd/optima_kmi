name: Debug — Tail server log / check schema

# Manual-only, buat baca storage/logs/laravel.log & cek skema DB
# tanpa perlu private key lokal. Tidak jalan otomatis.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'log = tail laravel.log, schema = cek kolom/tabel, migstatus = migrate:status, usersaudit = daftar akun (read-only)'
        required: false
        default: 'log'

env:
  REMOTE_PATH: /home/u518638233/domains/optima.kencomanufactur.co.id/public_html
  REMOTE_PHP: /opt/alt/php84/usr/bin/php

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Tail laravel.log (100 baris terakhir)
        if: ${{ github.event.inputs.mode == 'log' || github.event.inputs.mode == '' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "tail -n 100 ${{ env.REMOTE_PATH }}/storage/logs/laravel.log"

      - name: Ambil pesan ERROR terakhir (header, bukan stack trace)
        if: ${{ github.event.inputs.mode == 'lasterror' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "grep -a 'ERROR:' ${{ env.REMOTE_PATH }}/storage/logs/laravel.log | tail -5 | cut -c1-500"

      - name: Cek skema breakdown/tanggal_instalasi
        if: ${{ github.event.inputs.mode == 'schema' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              echo \"master_mesin.tanggal_instalasi: \" . (in_array(\"tanggal_instalasi\", Illuminate\\Support\\Facades\\Schema::getColumnListing(\"master_mesin\")) ? \"ADA\" : \"tidak ada\") . PHP_EOL;
              echo \"master_part.tanggal_instalasi: \" . (in_array(\"tanggal_instalasi\", Illuminate\\Support\\Facades\\Schema::getColumnListing(\"master_part\")) ? \"ADA\" : \"tidak ada\") . PHP_EOL;
              echo \"transaksi_breakdown_mesin table: \" . (Illuminate\\Support\\Facades\\Schema::hasTable(\"transaksi_breakdown_mesin\") ? \"ADA\" : \"tidak ada\") . PHP_EOL;
              echo \"transaksi_breakdown_dies table: \" . (Illuminate\\Support\\Facades\\Schema::hasTable(\"transaksi_breakdown_dies\") ? \"ADA\" : \"tidak ada\") . PHP_EOL;
              if (Illuminate\\Support\\Facades\\Schema::hasTable(\"transaksi_breakdown_dies\")) {
                echo \"  kolom id_part_proses: \" . (in_array(\"id_part_proses\", Illuminate\\Support\\Facades\\Schema::getColumnListing(\"transaksi_breakdown_dies\")) ? \"ADA\" : \"tidak ada\") . PHP_EOL;
                echo \"  jumlah baris: \" . Illuminate\\Support\\Facades\\DB::table(\"transaksi_breakdown_dies\")->count() . PHP_EOL;
              }
              if (Illuminate\\Support\\Facades\\Schema::hasTable(\"transaksi_breakdown_mesin\")) {
                echo \"  jumlah baris: \" . Illuminate\\Support\\Facades\\DB::table(\"transaksi_breakdown_mesin\")->count() . PHP_EOL;
              }
            "'

      - name: Migrate status (breakdown & tanggal_instalasi)
        if: ${{ github.event.inputs.mode == 'migstatus' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan migrate:status | grep -E 'tanggal_instalasi|breakdown'"

      # READ-ONLY. Audit sisa dari lubang registrasi publik (route /register dicabut
      # di commit 8beccd1). Controller lama tak pernah mengisi role & id_karyawan,
      # jadi akun hasil daftar-sendiri = role default 'staff_produksi' + id_karyawan NULL.
      # CATATAN: akun sah yang dibuat admin tapi belum di-assign karyawan terlihat
      # identik. Output ini perlu dibaca manusia, bukan dasar hapus otomatis.
      - name: Audit akun (read-only)
        if: ${{ github.event.inputs.mode == 'usersaudit' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              echo \"total user: \" . Illuminate\\Support\\Facades\\DB::table(\"users\")->count() . PHP_EOL . PHP_EOL;
              echo \"=== SEBARAN ROLE ===\" . PHP_EOL;
              foreach (Illuminate\\Support\\Facades\\DB::table(\"users\")->selectRaw(\"role, COUNT(*) as c\")->groupBy(\"role\")->orderBy(\"role\")->get() as \$r) {
                echo sprintf(\"%-20s %s\", \$r->role, \$r->c) . PHP_EOL;
              }
              echo PHP_EOL . \"=== AKUN id_karyawan NULL (kandidat, BUKAN vonis) ===\" . PHP_EOL;
              \$rows = Illuminate\\Support\\Facades\\DB::table(\"users\")->whereNull(\"id_karyawan\")->orderBy(\"created_at\")->get();
              echo \"jumlah: \" . \$rows->count() . PHP_EOL;
              foreach (\$rows as \$r) {
                echo sprintf(\"#%-4s %-24s %-34s %-18s %s\", \$r->id, \$r->name, \$r->email, \$r->role, \$r->created_at) . PHP_EOL;
              }
            "'

      # Daftar LENGKAP status migrasi di prod (mode `migstatus` sengaja di-grep sempit).
      # Read-only. Dipakai buat menyusun baseline gerbang CI cakupan migrasi.
      - name: Migrate status (semua)
        if: ${{ github.event.inputs.mode == 'migstatusall' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan migrate:status"

      # Probe: apakah objek schema dari migrasi ber-status "Pending" benar-benar
      # tidak ada, atau cuma tak tercatat (schema drift)? Read-only.
      - name: Cek objek schema migrasi Pending
        if: ${{ github.event.inputs.mode == 'driftcheck' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              \$S = Illuminate\\Support\\Facades\\Schema::class;
              foreach ([\"app_notifications\", \"chat_conversations\", \"chat_messages\", \"dies_preventive_log\"] as \$t) {
                echo sprintf(\"table %-22s : %s\", \$t, \$S::hasTable(\$t) ? \"ADA\" : \"TIDAK ADA\") . PHP_EOL;
              }
              echo sprintf(\"col   %-22s : %s\", \"checksheet_path\", \$S::hasColumn(\"dies_preventive_log\", \"checksheet_path\") ? \"ADA\" : \"TIDAK ADA\") . PHP_EOL;
              \$d = Illuminate\\Support\\Facades\\DB::selectOne(\"SHOW COLUMNS FROM master_karyawan LIKE (?)\", [\"departemen\"]);
              echo \"enum  departemen            : \" . (\$d->Type ?? \"?\") . PHP_EOL;
            "'

      - name: Max batch number
        if: ${{ github.event.inputs.mode == 'maxbatch' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute=\"echo 'max batch: ' . Illuminate\\\\Support\\\\Facades\\\\DB::table('migrations')->max('batch') . PHP_EOL;\""

      - name: Verify route resolves
        if: ${{ github.event.inputs.mode == 'checkroute' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan route:list | grep 'part.export'"

      - name: Insert migration bookkeeping (batch 11 — breakdown/tanggal_instalasi)
        if: ${{ github.event.inputs.mode == 'markran' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute=\"
              Illuminate\\\\Support\\\\Facades\\\\DB::table('migrations')->insert([
                ['migration' => '2026_06_26_100000_add_tanggal_instalasi_to_master_mesin', 'batch' => 11],
                ['migration' => '2026_06_26_100100_create_transaksi_breakdown_mesin_table', 'batch' => 11],
                ['migration' => '2026_06_26_110000_add_tanggal_instalasi_to_master_part', 'batch' => 11],
                ['migration' => '2026_06_26_110100_create_transaksi_breakdown_dies_table', 'batch' => 11],
                ['migration' => '2026_07_02_104959_add_id_part_proses_to_transaksi_breakdown_dies_table', 'batch' => 11],
              ]);
              echo 'inserted' . PHP_EOL;
            \""
