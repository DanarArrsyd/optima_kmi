name: Debug — Tail server log / check schema

# Manual-only, buat baca storage/logs/laravel.log & cek skema DB
# tanpa perlu private key lokal. Tidak jalan otomatis.
on:
  workflow_dispatch:
    inputs:
      mode:
        # DROPDOWN, bukan teks bebas. Sebelumnya teks bebas, dan satu salah ketik
        # (atau spasi yang ikut kepaste) membuat SEMUA step di-skip sementara
        # run-nya tetap HIJAU — gagal senyap, kelas bug yang sudah tiga kali
        # makan korban di repo ini. Dropdown menutupnya di sumbernya.
        description: 'Mode probe (semua read-only kecuali markran)'
        required: true
        default: 'log'
        type: choice
        options:
          - log            # tail laravel.log
          - lasterror      # pesan ERROR terakhir
          - schema         # cek kolom/tabel tertentu
          - migstatus      # migrate:status (breakdown & tanggal_instalasi)
          - migstatusall   # migrate:status semua
          - driftcheck     # cek objek schema migrasi Pending
          - usersaudit     # daftar akun
          - sphteoretis    # kandidat SPH teoretis (CSV)
          - maxbatch       # max batch number di tabel migrations
          - checkroute     # verifikasi route resolve
          - backupcheck    # kapasitas backup: mysqldump, disabled_functions, ukuran DB, sisa disk
          - dandoricek     # sesi dandori vs baris LHP: yatim, ambigu, operator beda
          - dandorilonggar # kenapa yatim: cocokkan tanpa shift, tanpa part, & jarak hari terdekat
          - dandoripart    # yatim dicocokkan per PART (bukan part_proses) + sebaran mesin/part
          - dandoripartno  # part_name kembar dgn part_no beda; cocokkan per NAMA part
          - markran        # ⚠️ MENULIS ke tabel migrations

env:
  REMOTE_PATH: /home/u518638233/domains/optima.kencomanufactur.co.id/public_html
  REMOTE_PHP: /opt/alt/php84/usr/bin/php

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # Gerbang: mode yang tidak punya step sama sekali harus MERAH, bukan hijau.
      #
      # Tanpa ini, mode tak dikenal menghasilkan run hijau dengan nol step jalan —
      # dan orang yang menjalankannya menyimpulkan "probe-nya bilang tidak ada
      # masalah", padahal probe-nya tidak pernah dijalankan. Itu lebih buruk
      # daripada error.
      #
      # Dropdown di atas sudah menutup salah ketik; yang ini menutup DRIFT: opsi
      # ditambah ke dropdown tapi step-nya lupa dibikin. Daftarnya tidak disalin —
      # ia dibaca dari `if:` di file ini sendiri, jadi satu sumber.
      - name: Checkout kode (buat gerbang mode)
        uses: actions/checkout@v5

      - name: Gerbang mode (mode tanpa step = merah)
        run: |
          mode="${{ github.event.inputs.mode }}"
          berkas=.github/workflows/debug-log.yml

          if ! grep -q "inputs.mode == '${mode}'" "$berkas"; then
            echo "::error::Mode '${mode}' ada di dropdown tapi TIDAK ADA step yang menjalankannya."
            echo "Mode yang punya step:"
            grep -oE "inputs\.mode == '[a-z]+'" "$berkas" | cut -d"'" -f2 | sort -u | sed 's/^/  - /'
            exit 1
          fi

          echo "Mode '${mode}' OK — step-nya ada."

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Tail laravel.log (100 baris terakhir)
        if: ${{ github.event.inputs.mode == 'log' || github.event.inputs.mode == '' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "tail -n 100 ${{ env.REMOTE_PATH }}/storage/logs/laravel.log"

      - name: Ambil pesan ERROR terakhir (header, bukan stack trace)
        if: ${{ github.event.inputs.mode == 'lasterror' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "grep -a 'ERROR:' ${{ env.REMOTE_PATH }}/storage/logs/laravel.log | tail -5 | cut -c1-500"

      - name: Cek skema breakdown/tanggal_instalasi
        if: ${{ github.event.inputs.mode == 'schema' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              echo \"master_mesin.tanggal_instalasi: \" . (in_array(\"tanggal_instalasi\", Illuminate\\Support\\Facades\\Schema::getColumnListing(\"master_mesin\")) ? \"ADA\" : \"tidak ada\") . PHP_EOL;
              echo \"master_part.tanggal_instalasi: \" . (in_array(\"tanggal_instalasi\", Illuminate\\Support\\Facades\\Schema::getColumnListing(\"master_part\")) ? \"ADA\" : \"tidak ada\") . PHP_EOL;
              echo \"transaksi_breakdown_mesin table: \" . (Illuminate\\Support\\Facades\\Schema::hasTable(\"transaksi_breakdown_mesin\") ? \"ADA\" : \"tidak ada\") . PHP_EOL;
              echo \"transaksi_breakdown_dies table: \" . (Illuminate\\Support\\Facades\\Schema::hasTable(\"transaksi_breakdown_dies\") ? \"ADA\" : \"tidak ada\") . PHP_EOL;
              if (Illuminate\\Support\\Facades\\Schema::hasTable(\"transaksi_breakdown_dies\")) {
                echo \"  kolom id_part_proses: \" . (in_array(\"id_part_proses\", Illuminate\\Support\\Facades\\Schema::getColumnListing(\"transaksi_breakdown_dies\")) ? \"ADA\" : \"tidak ada\") . PHP_EOL;
                echo \"  jumlah baris: \" . Illuminate\\Support\\Facades\\DB::table(\"transaksi_breakdown_dies\")->count() . PHP_EOL;
              }
              if (Illuminate\\Support\\Facades\\Schema::hasTable(\"transaksi_breakdown_mesin\")) {
                echo \"  jumlah baris: \" . Illuminate\\Support\\Facades\\DB::table(\"transaksi_breakdown_mesin\")->count() . PHP_EOL;
              }
            "'

      # Probe kapasitas sebelum membangun halaman Backup Sistem. Semuanya read-only:
      # tidak ada dump yang dibuat, tidak ada berkas ditulis. Yang dijawab persis
      # empat hal yang menentukan bentuk implementasinya — dan yang salah satunya
      # tidak bisa diketahui dari mesin lokal, karena disabled_functions PHP-FPM
      # di hosting berbeda dari PHP CLI yang dipakai SSH ini.
      - name: Cek kapasitas backup (read-only)
        if: ${{ github.event.inputs.mode == 'backupcheck' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'echo "=== 1. Biner mysqldump ==="; \
             command -v mysqldump || echo "TIDAK ADA di PATH"; \
             ls -la /usr/bin/mysqldump /opt/alt/mysql*/usr/bin/mysqldump 2>/dev/null || true; \
             echo; echo "=== 2. Fungsi PHP yang dimatikan (CLI) ==="; \
             ${{ env.REMOTE_PHP }} -r "echo ini_get(\"disabled_functions\") ?: \"(kosong)\", PHP_EOL;"; \
             echo "   memory_limit: $(${{ env.REMOTE_PHP }} -r "echo ini_get(\"memory_limit\");")"; \
             echo "   max_execution_time: $(${{ env.REMOTE_PHP }} -r "echo ini_get(\"max_execution_time\");")"; \
             echo; echo "=== 3. Ukuran database per tabel (MB) ==="; \
             cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
               \$db = Illuminate\\Support\\Facades\\DB::connection()->getDatabaseName();
               \$r = Illuminate\\Support\\Facades\\DB::select(\"SELECT table_name AS t, table_rows AS n, ROUND((data_length+index_length)/1024/1024,2) AS mb FROM information_schema.tables WHERE table_schema=? ORDER BY (data_length+index_length) DESC LIMIT 12\", [\$db]);
               \$tot = Illuminate\\Support\\Facades\\DB::select(\"SELECT ROUND(SUM(data_length+index_length)/1024/1024,2) AS mb, COUNT(*) AS jml FROM information_schema.tables WHERE table_schema=?\", [\$db]);
               foreach (\$r as \$x) { echo str_pad(\$x->t, 34), str_pad((string) \$x->n, 10, \" \", STR_PAD_LEFT), str_pad(\$x->mb.\" MB\", 12, \" \", STR_PAD_LEFT), PHP_EOL; }
               echo \"TOTAL: \", \$tot[0]->mb, \" MB dalam \", \$tot[0]->jml, \" tabel\", PHP_EOL;
             " < /dev/null; \
             echo; echo "=== 4. Sisa disk & ukuran berkas unggahan ==="; \
             df -h ${{ env.REMOTE_PATH }} | tail -2; \
             du -sh ${{ env.REMOTE_PATH }}/storage/app/private 2>/dev/null || echo "storage/app/private belum ada"'

      # Probe sebelum menggabungkan input Dandori ke dalam form LHP Produksi.
      # Read-only. Yang dijawab tiga hal yang menentukan apakah penggabungan itu
      # aman, dan tidak satu pun bisa dijawab dari mesin lokal:
      #
      #   1. Berapa sesi dandori yang TIDAK punya baris LHP pasangannya. Kalau
      #      jumlahnya besar, mencabut tombol input dari halaman Dandori berarti
      #      kejadian itu tidak bisa dicatat lagi sama sekali.
      #   2. Berapa kombinasi tanggal+shift+mesin+part yang punya LEBIH DARI SATU
      #      baris LHP. Di situlah "dandori nempel ke baris yang mana" jadi ambigu.
      #   3. Berapa sesi yang operator dandorinya BEDA dari operator LHP-nya —
      #      menentukan boleh tidaknya operator diwarisi dari form produksi.
      #
      # Kunci sesi sengaja TANPA id_karyawan: operator dandori memang bisa beda
      # dari operator yang menjalankan produksinya, dan itu justru yang diukur.
      - name: Cek sesi Dandori vs baris LHP (read-only)
        if: ${{ github.event.inputs.mode == 'dandoricek' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              \$q = fn(\$sql) => Illuminate\\Support\\Facades\\DB::select(\$sql);

              \$a = \$q(\"SELECT COUNT(*) baris, COUNT(DISTINCT CONCAT_WS(0x7c,tanggal,id_shift,id_mesin,id_part_proses)) sesi FROM transaksi_dandori_rincian WHERE deleted_at IS NULL\")[0];
              echo \"=== 1. Volume dandori ===\", PHP_EOL;
              echo \"  baris rincian : \", \$a->baris, PHP_EOL;
              echo \"  sesi (tgl+shift+mesin+part) : \", \$a->sesi, PHP_EOL;
              echo \"  rata-rata rincian per sesi : \", \$a->sesi ? round(\$a->baris / \$a->sesi, 2) : 0, PHP_EOL, PHP_EOL;

              \$b = \$q(\"SELECT SUM(CASE WHEN p.n IS NULL THEN 1 ELSE 0 END) yatim, SUM(CASE WHEN p.n IS NOT NULL THEN 1 ELSE 0 END) berpasangan FROM (SELECT DISTINCT tanggal,id_shift,id_mesin,id_part_proses FROM transaksi_dandori_rincian WHERE deleted_at IS NULL) d LEFT JOIN (SELECT tanggal_produksi,id_shift,id_mesin,id_part_proses,COUNT(*) n FROM transaksi_produksi WHERE deleted_at IS NULL GROUP BY 1,2,3,4) p ON p.tanggal_produksi=d.tanggal AND p.id_shift=d.id_shift AND p.id_mesin=d.id_mesin AND p.id_part_proses=d.id_part_proses\")[0];
              echo \"=== 2. Sesi dandori punya pasangan LHP? ===\", PHP_EOL;
              echo \"  berpasangan : \", (int) \$b->berpasangan, PHP_EOL;
              echo \"  YATIM       : \", (int) \$b->yatim, PHP_EOL, PHP_EOL;

              \$c = \$q(\"SELECT COUNT(*) kombinasi, SUM(CASE WHEN n>1 THEN 1 ELSE 0 END) lebih_dari_satu, MAX(n) terbanyak FROM (SELECT COUNT(*) n FROM transaksi_produksi WHERE deleted_at IS NULL GROUP BY tanggal_produksi,id_shift,id_mesin,id_part_proses) x\")[0];
              echo \"=== 3. Ambiguitas: berapa baris LHP per kombinasi ===\", PHP_EOL;
              echo \"  total kombinasi    : \", \$c->kombinasi, PHP_EOL;
              echo \"  punya >1 baris LHP : \", (int) \$c->lebih_dari_satu, PHP_EOL;
              echo \"  terbanyak dalam satu kombinasi : \", \$c->terbanyak, PHP_EOL, PHP_EOL;

              \$d = \$q(\"SELECT COUNT(*) beda FROM (SELECT DISTINCT d.tanggal,d.id_shift,d.id_mesin,d.id_part_proses,d.id_karyawan FROM transaksi_dandori_rincian d WHERE d.deleted_at IS NULL) d JOIN transaksi_produksi p ON p.tanggal_produksi=d.tanggal AND p.id_shift=d.id_shift AND p.id_mesin=d.id_mesin AND p.id_part_proses=d.id_part_proses AND p.deleted_at IS NULL WHERE p.id_karyawan<>d.id_karyawan\")[0];
              echo \"=== 4. Operator dandori beda dari operator LHP ===\", PHP_EOL;
              echo \"  sesi dengan operator berbeda : \", \$d->beda, PHP_EOL, PHP_EOL;

              echo \"=== 5. Sepuluh contoh sesi YATIM ===\", PHP_EOL;
              foreach (\$q(\"SELECT d.tanggal,d.id_shift,d.id_mesin,d.id_part_proses FROM (SELECT DISTINCT tanggal,id_shift,id_mesin,id_part_proses FROM transaksi_dandori_rincian WHERE deleted_at IS NULL) d LEFT JOIN (SELECT DISTINCT tanggal_produksi,id_shift,id_mesin,id_part_proses FROM transaksi_produksi WHERE deleted_at IS NULL) p ON p.tanggal_produksi=d.tanggal AND p.id_shift=d.id_shift AND p.id_mesin=d.id_mesin AND p.id_part_proses=d.id_part_proses WHERE p.tanggal_produksi IS NULL ORDER BY d.tanggal DESC LIMIT 10\") as \$x) {
                echo \"  \", \$x->tanggal, \"  shift=\", \$x->id_shift, \"  mesin=\", \$x->id_mesin, \"  part_proses=\", \$x->id_part_proses, PHP_EOL;
              }
            " < /dev/null'

      # Lanjutan dandoricek. Mode itu memakai kunci ketat (tanggal+shift+mesin+part)
      # dan menemukan 60% sesi dandori yatim. Angka itu belum bisa dipercaya
      # sebagai "dandori memang berdiri sendiri" — kunci ketat juga menghasilkan
      # yatim palsu kalau ganti dies terjadi di akhir shift dan produksinya jalan
      # shift atau hari berikutnya, atau kalau id_part_proses dandori merujuk part
      # yang DITINGGALKAN, bukan yang dituju.
      #
      # Mode ini melonggarkan kuncinya satu per satu supaya kelihatan yatimnya
      # nyata atau cuma salah cocok. Read-only.
      - name: Kuliti sesi Dandori yatim (read-only)
        if: ${{ github.event.inputs.mode == 'dandorilonggar' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              \$q = fn(\$sql) => Illuminate\\Support\\Facades\\DB::select(\$sql);

              \$a = \$q(\"SELECT COUNT(*) total, SUM(CASE WHEN p.tanggal_produksi IS NULL THEN 1 ELSE 0 END) yatim FROM (SELECT DISTINCT tanggal,id_mesin,id_part_proses FROM transaksi_dandori_rincian WHERE deleted_at IS NULL) d LEFT JOIN (SELECT DISTINCT tanggal_produksi,id_mesin,id_part_proses FROM transaksi_produksi WHERE deleted_at IS NULL) p ON p.tanggal_produksi=d.tanggal AND p.id_mesin=d.id_mesin AND p.id_part_proses=d.id_part_proses\")[0];
              echo \"=== A. Cocokkan TANPA shift (tanggal+mesin+part) ===\", PHP_EOL;
              echo \"  total sesi : \", \$a->total, \"   yatim : \", (int) \$a->yatim, PHP_EOL, PHP_EOL;

              \$b = \$q(\"SELECT COUNT(*) total, SUM(CASE WHEN p.tanggal_produksi IS NULL THEN 1 ELSE 0 END) yatim FROM (SELECT DISTINCT tanggal,id_shift,id_mesin FROM transaksi_dandori_rincian WHERE deleted_at IS NULL) d LEFT JOIN (SELECT DISTINCT tanggal_produksi,id_shift,id_mesin FROM transaksi_produksi WHERE deleted_at IS NULL) p ON p.tanggal_produksi=d.tanggal AND p.id_shift=d.id_shift AND p.id_mesin=d.id_mesin\")[0];
              echo \"=== B. Cocokkan TANPA part_proses (tanggal+shift+mesin) ===\", PHP_EOL;
              echo \"  total sesi : \", \$b->total, \"   yatim : \", (int) \$b->yatim, PHP_EOL, PHP_EOL;

              echo \"=== C. Sesi yatim (kunci ketat): jarak hari ke LHP terdekat, mesin+part sama ===\", PHP_EOL;
              foreach (\$q(\"SELECT CASE WHEN m.jarak IS NULL THEN \\\"z. mesin+part ini TIDAK PERNAH ada LHP\\\" WHEN m.jarak=0 THEN \\\"a. hari sama, shift beda\\\" WHEN m.jarak=1 THEN \\\"b. selisih 1 hari\\\" WHEN m.jarak<=7 THEN \\\"c. selisih 2-7 hari\\\" ELSE \\\"d. selisih lebih dari 7 hari\\\" END ember, COUNT(*) jumlah FROM (SELECT d.tanggal,(SELECT MIN(ABS(DATEDIFF(p.tanggal_produksi,d.tanggal))) FROM transaksi_produksi p WHERE p.deleted_at IS NULL AND p.id_mesin=d.id_mesin AND p.id_part_proses=d.id_part_proses) jarak FROM (SELECT DISTINCT tanggal,id_shift,id_mesin,id_part_proses FROM transaksi_dandori_rincian WHERE deleted_at IS NULL) d LEFT JOIN (SELECT DISTINCT tanggal_produksi,id_shift,id_mesin,id_part_proses FROM transaksi_produksi WHERE deleted_at IS NULL) p2 ON p2.tanggal_produksi=d.tanggal AND p2.id_shift=d.id_shift AND p2.id_mesin=d.id_mesin AND p2.id_part_proses=d.id_part_proses WHERE p2.tanggal_produksi IS NULL) m GROUP BY ember ORDER BY ember\") as \$x) {
                echo \"  \", str_pad(\$x->ember, 42), \$x->jumlah, PHP_EOL;
              }
            " < /dev/null'

      # Lanjutan dandorilonggar. Satu hipotesis belum diuji dan kalau benar ia
      # menjelaskan hampir seluruh 3.594 sesi "mesin+part tidak pernah ada LHP"
      # TANPA ada produksi yang hilang:
      #
      #   master_part_proses = (id_part, nama_proses) — SATU part punya BANYAK
      #   proses. Dandori dicatat pada proses yang diesnya diganti, sementara
      #   LHP-nya bisa tercatat pada proses LAIN dari part yang sama. Kunci
      #   sebelumnya memakai id_part_proses, jadi pasangan seperti itu terhitung
      #   yatim padahal produksinya ada.
      #
      # Kalau yatimnya kolaps saat dicocokkan per PART, ini soal granularitas —
      # bukan soal produksi yang tidak dicatat. Kalau tidak kolaps, sebaran per
      # mesin dan per part menunjukkan apakah kekosongannya terpusat (satu area
      # produksi memang tidak masuk sistem) atau menyebar tipis (pembatalan yang
      # wajar). Read-only.
      - name: Cocokkan Dandori per PART, bukan per proses (read-only)
        if: ${{ github.event.inputs.mode == 'dandoripart' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              \$q = fn(\$sql) => Illuminate\\Support\\Facades\\DB::select(\$sql);

              \$a = \$q(\"SELECT COUNT(*) total, SUM(CASE WHEN x.id_part IS NULL THEN 1 ELSE 0 END) yatim FROM (SELECT DISTINCT d.tanggal, d.id_mesin, pp.id_part FROM transaksi_dandori_rincian d JOIN master_part_proses pp ON pp.id=d.id_part_proses WHERE d.deleted_at IS NULL) d LEFT JOIN (SELECT DISTINCT p.tanggal_produksi, p.id_mesin, pp2.id_part FROM transaksi_produksi p JOIN master_part_proses pp2 ON pp2.id=p.id_part_proses WHERE p.deleted_at IS NULL) x ON x.tanggal_produksi=d.tanggal AND x.id_mesin=d.id_mesin AND x.id_part=d.id_part\")[0];
              echo \"=== A. Cocokkan per PART, hari sama, mesin sama ===\", PHP_EOL;
              echo \"  total sesi : \", \$a->total, \"   yatim : \", (int) \$a->yatim, PHP_EOL, PHP_EOL;

              \$b = \$q(\"SELECT COUNT(*) total, SUM(CASE WHEN x.id_part IS NULL THEN 1 ELSE 0 END) yatim FROM (SELECT DISTINCT d.id_mesin, pp.id_part FROM transaksi_dandori_rincian d JOIN master_part_proses pp ON pp.id=d.id_part_proses WHERE d.deleted_at IS NULL) d LEFT JOIN (SELECT DISTINCT p.id_mesin, pp2.id_part FROM transaksi_produksi p JOIN master_part_proses pp2 ON pp2.id=p.id_part_proses WHERE p.deleted_at IS NULL) x ON x.id_mesin=d.id_mesin AND x.id_part=d.id_part\")[0];
              echo \"=== B. Kombinasi mesin+PART: pernah ada LHP kapan pun? ===\", PHP_EOL;
              echo \"  total kombinasi : \", \$b->total, \"   tidak pernah ada LHP : \", (int) \$b->yatim, PHP_EOL, PHP_EOL;

              echo \"=== C. Sepuluh MESIN penyumbang sesi yatim terbanyak (kunci ketat) ===\", PHP_EOL;
              foreach (\$q(\"SELECT m.id_mesin nama, COUNT(*) jumlah FROM (SELECT DISTINCT d.tanggal,d.id_shift,d.id_mesin,d.id_part_proses FROM transaksi_dandori_rincian d WHERE d.deleted_at IS NULL) d LEFT JOIN (SELECT DISTINCT tanggal_produksi,id_shift,id_mesin,id_part_proses FROM transaksi_produksi WHERE deleted_at IS NULL) p ON p.tanggal_produksi=d.tanggal AND p.id_shift=d.id_shift AND p.id_mesin=d.id_mesin AND p.id_part_proses=d.id_part_proses JOIN master_mesin m ON m.id=d.id_mesin WHERE p.tanggal_produksi IS NULL GROUP BY m.id_mesin ORDER BY jumlah DESC LIMIT 10\") as \$x) {
                echo \"  \", str_pad(\$x->nama, 14), \$x->jumlah, PHP_EOL;
              }
              echo PHP_EOL;

              echo \"=== D. Sepuluh PART penyumbang sesi yatim terbanyak ===\", PHP_EOL;
              foreach (\$q(\"SELECT mp.part_name nama, pp.nama_proses proses, COUNT(*) jumlah FROM (SELECT DISTINCT d.tanggal,d.id_shift,d.id_mesin,d.id_part_proses FROM transaksi_dandori_rincian d WHERE d.deleted_at IS NULL) d LEFT JOIN (SELECT DISTINCT tanggal_produksi,id_shift,id_mesin,id_part_proses FROM transaksi_produksi WHERE deleted_at IS NULL) p ON p.tanggal_produksi=d.tanggal AND p.id_shift=d.id_shift AND p.id_mesin=d.id_mesin AND p.id_part_proses=d.id_part_proses JOIN master_part_proses pp ON pp.id=d.id_part_proses JOIN master_part mp ON mp.id=pp.id_part WHERE p.tanggal_produksi IS NULL GROUP BY mp.part_name, pp.nama_proses ORDER BY jumlah DESC LIMIT 10\") as \$x) {
                echo \"  \", str_pad(substr(\$x->nama, 0, 30), 32), str_pad(\$x->proses, 16), \$x->jumlah, PHP_EOL;
              }
            " < /dev/null'

      # Lanjutan dandoripart. Mencocokkan per id_part menyisakan 44% yatim, dan
      # satu part (FRAME DR CTR) menyumbang 66% dari seluruh sesi yatim.
      #
      # Hipotesis terakhir: unique pada master_part.part_no SUDAH DICABUT
      # (migrasi 2026_06_10_100000), jadi satu nama part boleh punya beberapa
      # baris master dengan part_no berbeda. Kalau dandori menunjuk baris yang
      # satu dan LHP menunjuk baris yang lain, pasangannya terhitung yatim
      # walaupun produksinya ada — dan id_part pun tidak cukup sebagai kunci.
      #
      # Yang diuji: berapa nama part yang punya lebih dari satu baris master,
      # rincian baris untuk FRAME DR, dan apakah yatim kolaps saat dicocokkan
      # per NAMA part. Read-only.
      - name: Cek part_name kembar & cocokkan per nama part (read-only)
        if: ${{ github.event.inputs.mode == 'dandoripartno' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              \$q = fn(\$sql) => Illuminate\\Support\\Facades\\DB::select(\$sql);

              \$a = \$q(\"SELECT COUNT(*) nama_unik, SUM(CASE WHEN n>1 THEN 1 ELSE 0 END) nama_kembar, MAX(n) terbanyak FROM (SELECT part_name, COUNT(*) n FROM master_part WHERE deleted_at IS NULL GROUP BY part_name) x\")[0];
              echo \"=== A. Nama part yang punya lebih dari satu baris master ===\", PHP_EOL;
              echo \"  nama unik   : \", \$a->nama_unik, PHP_EOL;
              echo \"  nama kembar : \", (int) \$a->nama_kembar, PHP_EOL;
              echo \"  terbanyak dalam satu nama : \", \$a->terbanyak, PHP_EOL, PHP_EOL;

              echo \"=== B. Baris master untuk nama mengandung FRAME DR ===\", PHP_EOL;
              echo \"  id | part_no | customer | proses | baris dandori | baris LHP\", PHP_EOL;
              foreach (\$q(\"SELECT mp.id, mp.part_no, mp.customer, mp.part_name, (SELECT COUNT(*) FROM master_part_proses pp WHERE pp.id_part=mp.id) proses, (SELECT COUNT(*) FROM transaksi_dandori_rincian d JOIN master_part_proses pp2 ON pp2.id=d.id_part_proses WHERE pp2.id_part=mp.id AND d.deleted_at IS NULL) dandori, (SELECT COUNT(*) FROM transaksi_produksi p JOIN master_part_proses pp3 ON pp3.id=p.id_part_proses WHERE pp3.id_part=mp.id AND p.deleted_at IS NULL) lhp FROM master_part mp WHERE mp.deleted_at IS NULL AND mp.part_name LIKE \\\"%FRAME DR%\\\" ORDER BY dandori DESC LIMIT 15\") as \$x) {
                echo \"  \", str_pad(\$x->id, 5), str_pad(substr(\$x->part_no, 0, 20), 22), str_pad(substr((string) \$x->customer, 0, 12), 14), str_pad(\$x->proses, 8), str_pad(\$x->dandori, 15), \$x->lhp, PHP_EOL;
              }
              echo PHP_EOL;

              \$c = \$q(\"SELECT COUNT(*) total, SUM(CASE WHEN x.nm IS NULL THEN 1 ELSE 0 END) yatim FROM (SELECT DISTINCT d.tanggal, d.id_mesin, mp.part_name nm FROM transaksi_dandori_rincian d JOIN master_part_proses pp ON pp.id=d.id_part_proses JOIN master_part mp ON mp.id=pp.id_part WHERE d.deleted_at IS NULL) d LEFT JOIN (SELECT DISTINCT p.tanggal_produksi, p.id_mesin, mp2.part_name nm FROM transaksi_produksi p JOIN master_part_proses pp2 ON pp2.id=p.id_part_proses JOIN master_part mp2 ON mp2.id=pp2.id_part WHERE p.deleted_at IS NULL) x ON x.tanggal_produksi=d.tanggal AND x.id_mesin=d.id_mesin AND x.nm=d.nm\")[0];
              echo \"=== C. Cocokkan per NAMA part (tanggal+mesin+part_name) ===\", PHP_EOL;
              echo \"  total sesi : \", \$c->total, \"   yatim : \", (int) \$c->yatim, PHP_EOL;
            " < /dev/null'

      - name: Migrate status (breakdown & tanggal_instalasi)
        if: ${{ github.event.inputs.mode == 'migstatus' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan migrate:status | grep -E 'tanggal_instalasi|breakdown'"

      # READ-ONLY. Audit sisa dari lubang registrasi publik (route /register dicabut
      # di commit 8beccd1). Controller lama tak pernah mengisi role & id_karyawan,
      # jadi akun hasil daftar-sendiri = role default 'staff_produksi' + id_karyawan NULL.
      # CATATAN: akun sah yang dibuat admin tapi belum di-assign karyawan terlihat
      # identik. Output ini perlu dibaca manusia, bukan dasar hapus otomatis.
      - name: Audit akun (read-only)
        if: ${{ github.event.inputs.mode == 'usersaudit' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              echo \"total user: \" . Illuminate\\Support\\Facades\\DB::table(\"users\")->count() . PHP_EOL . PHP_EOL;
              echo \"=== SEBARAN ROLE ===\" . PHP_EOL;
              foreach (Illuminate\\Support\\Facades\\DB::table(\"users\")->selectRaw(\"role, COUNT(*) as c\")->groupBy(\"role\")->orderBy(\"role\")->get() as \$r) {
                echo sprintf(\"%-20s %s\", \$r->role, \$r->c) . PHP_EOL;
              }
              echo PHP_EOL . \"=== AKUN id_karyawan NULL (kandidat, BUKAN vonis) ===\" . PHP_EOL;
              \$rows = Illuminate\\Support\\Facades\\DB::table(\"users\")->whereNull(\"id_karyawan\")->orderBy(\"created_at\")->get();
              echo \"jumlah: \" . \$rows->count() . PHP_EOL;
              foreach (\$rows as \$r) {
                echo sprintf(\"#%-4s %-24s %-34s %-18s %s\", \$r->id, \$r->name, \$r->email, \$r->role, \$r->created_at) . PHP_EOL;
              }
            "'

      # Daftar LENGKAP status migrasi di prod (mode `migstatus` sengaja di-grep sempit).
      # Read-only. Dipakai buat menyusun baseline gerbang CI cakupan migrasi.
      - name: Migrate status (semua)
        if: ${{ github.event.inputs.mode == 'migstatusall' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan migrate:status"

      # Probe: apakah objek schema dari migrasi ber-status "Pending" benar-benar
      # tidak ada, atau cuma tak tercatat (schema drift)? Read-only.
      - name: Cek objek schema migrasi Pending
        if: ${{ github.event.inputs.mode == 'driftcheck' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute="
              \$S = Illuminate\\Support\\Facades\\Schema::class;
              foreach ([\"app_notifications\", \"chat_conversations\", \"chat_messages\", \"dies_preventive_log\"] as \$t) {
                echo sprintf(\"table %-22s : %s\", \$t, \$S::hasTable(\$t) ? \"ADA\" : \"TIDAK ADA\") . PHP_EOL;
              }
              echo sprintf(\"col   %-22s : %s\", \"checksheet_path\", \$S::hasColumn(\"dies_preventive_log\", \"checksheet_path\") ? \"ADA\" : \"TIDAK ADA\") . PHP_EOL;
            "'

      # Kandidat SPH teoretis per part+proses — READ-ONLY, nol tulisan ke DB.
      # Keluar sebagai CSV supaya bisa disalin ke spreadsheet untuk ditinjau.
      - name: Kandidat SPH teoretis (read-only)
        if: ${{ github.event.inputs.mode == 'sphteoretis' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            'cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan optima:sph-teoretis --csv'

      - name: Max batch number
        if: ${{ github.event.inputs.mode == 'maxbatch' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute=\"echo 'max batch: ' . Illuminate\\\\Support\\\\Facades\\\\DB::table('migrations')->max('batch') . PHP_EOL;\""

      - name: Verify route resolves
        if: ${{ github.event.inputs.mode == 'checkroute' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan route:list | grep 'part.export'"

      - name: Insert migration bookkeeping (batch 11 — breakdown/tanggal_instalasi)
        if: ${{ github.event.inputs.mode == 'markran' }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ env.REMOTE_PATH }} && ${{ env.REMOTE_PHP }} artisan tinker --execute=\"
              Illuminate\\\\Support\\\\Facades\\\\DB::table('migrations')->insert([
                ['migration' => '2026_06_26_100000_add_tanggal_instalasi_to_master_mesin', 'batch' => 11],
                ['migration' => '2026_06_26_100100_create_transaksi_breakdown_mesin_table', 'batch' => 11],
                ['migration' => '2026_06_26_110000_add_tanggal_instalasi_to_master_part', 'batch' => 11],
                ['migration' => '2026_06_26_110100_create_transaksi_breakdown_dies_table', 'batch' => 11],
                ['migration' => '2026_07_02_104959_add_id_part_proses_to_transaksi_breakdown_dies_table', 'batch' => 11],
              ]);
              echo 'inserted' . PHP_EOL;
            \""
